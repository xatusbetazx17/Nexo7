[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo7-assistant"
version = "0.12.0"
description = "Independent local assistant with configurable model providers and source-grounded research"
requires-python = ">=3.11"
dependencies = ["pypdf==6.10.0", "Pillow==12.3.0"]

[project.scripts]
nexo7 = "nexo7.__main__:main"
nexo7-desktop = "nexo7.desktop:main"

[tool.setuptools.packages.find]
include = ["nexo7*"]

[tool.setuptools.package-data]
nexo7 = ["web/*", "knowledge/*", "native_catalog.json", "licenses/*"]
