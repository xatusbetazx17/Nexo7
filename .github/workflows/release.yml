name: Desktop release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-runtime.txt
      - run: npm install --prefix "$RUNNER_TEMP/nexo-ui" --no-save playwright@1.62.1
      - name: Browser layout and interaction checks
        env:
          NEXO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nexo-ui/node_modules/playwright
          NEXO_CHROME: /usr/bin/google-chrome
        run: node scripts/ui_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-review
          path: reports/browser
          if-no-files-found: warn
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install document reader
        run: python -m pip install -r requirements-runtime.txt
      - name: Validate application
        run: python -m unittest discover -s tests -v
      - name: Run engineering smoke tasks
        run: python scripts/evaluate.py --output reports/evaluation-demo.json
      - name: Validate reviewed learning pack
        run: python scripts/evaluate_learning.py
      - name: Install packaging tools
        run: python -m pip install pyinstaller==6.22.0
      - uses: actions/cache@v4
        with:
          path: nexo7/image_runtime
          key: diffusion-cpu-adaptive-${{ runner.os }}-2f886889-v3
          restore-keys: diffusion-cpu-noavx-${{ runner.os }}-2f886889-v2
      - uses: actions/cache@v4
        with:
          path: build/image-model-cache
          key: dreamshaper8-q4-taesd-${{ runner.os }}-a59b0154
      - name: Build baseline and adaptive CPU image engines
        run: python scripts/build_image_runtime.py
      - uses: actions/cache/save@v4
        with:
          path: nexo7/image_runtime
          key: diffusion-cpu-adaptive-${{ runner.os }}-2f886889-v3
      - name: Build and test native executable
        run: python scripts/build_desktop.py
      - name: Real diffusion with 4 GB available RAM
        run: python scripts/smoke_images.py --simulate-4gb-free
      - name: Real baseline CPU draft with 4 GB available RAM
        run: python scripts/smoke_images.py --simulate-4gb-free --baseline
      - name: Real diffusion in packaged application
        run: python scripts/smoke_images.py --binary dist/Nexo7${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diffusion-review-${{ matrix.os }}
          path: reports/diffusion
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/image-model-cache
          key: dreamshaper8-q4-taesd-${{ runner.os }}-a59b0154
      - name: Check LiquidAI creation before other model downloads
        run: python scripts/smoke_vision.py --simulate-4gb --output reports/native-vision-4gb-smoke.json
      - name: Live web lookup and saved-source reuse in packaged app
        run: python scripts/smoke_web.py dist/Nexo7${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Real native model smoke test
        run: python scripts/smoke_native.py --binary dist/Nexo7${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Real native inference with simulated 8 GB total and 4 GB available
        run: python scripts/smoke_native.py --simulate-8gb --output reports/native-8gb-smoke.json
      - name: Real native inference with simulated 4 GB total and 2.5 GB available
        run: python scripts/smoke_native.py --simulate-4gb --output reports/native-4gb-smoke.json
      - name: Optional candidate with guarded 8 GB simulation and real task workflow
        run: python scripts/smoke_native.py --simulate-8gb --candidate --output reports/native-candidate-smoke.json
      - name: Real packaged LiquidAI image inference and model switching
        run: python scripts/smoke_vision.py --binary dist/Nexo7${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [build, interface]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.16.0' }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; native builds remain available as workflow artifacts."
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --prerelease --title "Nexo 7 $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          fi
