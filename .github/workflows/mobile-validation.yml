name: Mobile validation
on:
  push:
    branches: [navi-mobile-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-runtime.txt
      - run: npm ci --prefix mobile --ignore-scripts
      - run: npm run build --prefix mobile
      - run: npm install --prefix "$RUNNER_TEMP/nexo-ui" --no-save playwright@1.62.1
      - name: Check simple English and Spanish answers
        env:
          NEXO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nexo-ui/node_modules/playwright
          NEXO_CHROME: /usr/bin/google-chrome
        run: node scripts/mobile_probe.cjs
      - name: Mobile transfer, CPU inference and offline use
        env:
          NEXO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nexo-ui/node_modules/playwright
          NEXO_CHROME: /usr/bin/google-chrome
        run: node scripts/mobile_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-review
          path: reports/mobile
      - name: Desktop microphone and interface
        env:
          NEXO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nexo-ui/node_modules/playwright
          NEXO_CHROME: /usr/bin/google-chrome
        run: node scripts/ui_browser.cjs
