name: Mobile validation
on:
  push:
    branches: [navi-mobile-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix mobile --ignore-scripts
      - run: npm run build --prefix mobile
      - run: npm install --prefix "$RUNNER_TEMP/nexo-ui" --no-save playwright@1.62.1
      - name: Evaluate pinned mobile model responses
        env:
          NEXO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nexo-ui/node_modules/playwright
          NEXO_CHROME: /usr/bin/google-chrome
        run: node scripts/mobile_probe.cjs
