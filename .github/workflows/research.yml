name: Model research validation
on:
  push:
    paths: ['research/**', 'tests/test_research.py', 'tests/research_fixtures/**', 'scripts/smoke_research.py', 'requirements-research.txt', '.github/workflows/research.yml']
  pull_request:
    paths: ['research/**', 'tests/test_research.py', 'tests/research_fixtures/**', 'scripts/smoke_research.py', 'requirements-research.txt', '.github/workflows/research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-smoke:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -p test_research.py -v
      - run: python scripts/smoke_research.py
