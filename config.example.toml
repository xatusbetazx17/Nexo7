# Advanced configuration. Copy to config.toml. Demo has no AI model.
# Use the desktop wizard for guarded local inference.
provider = "demo"
response_language = "auto"
model = ""
fast_model = ""
deep_model = ""
ollama_url = "http://127.0.0.1:11434"
ollama_context_tokens = 8192
# Own model server (Ollama, llama.cpp, or any OpenAI-compatible
# /v1/chat/completions endpoint you run yourself). Plain http:// is only
# accepted on this machine or your private home network; anything across the
# internet must use https://. Optional key comes from the NEXO_SERVER_API_KEY
# environment variable, never from chat or this file. See docs/OWN-SERVER.md.
# provider = "server"
# model = "qwen2.5:14b"
# server_url = "http://192.168.1.20:11434"
database = "data/nexo.sqlite3"
max_output_tokens = 800
max_total_output_tokens = 2400
max_model_calls = 3
max_tool_calls = 4
max_context_chars = 22000
history_messages = 8
cache_seconds = 600
timeout_seconds = 90
research_network = true
persist_history = true
input_price_per_million = -1.0
cached_input_price_per_million = -1.0
output_price_per_million = -1.0
